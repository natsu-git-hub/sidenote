<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="node_modules/pdfjs-dist/web/pdf_viewer.css">
    <link rel="stylesheet" href="style.css">
    <title>Sidenote</title>
  </head>
  <body>
    <h1>Sidenote</h1>
    <p>👋</p>
    <button id="openBtn">Open PDF</button>
    <ul id="fileList"></ul>
    <div id="thumbnailSidebar"></div>
    <div>
      <button id="prevBtn">Prev</button>
      <input id="pageNum" type="number" value="1" min="1">
      <button id="nextBtn">Next</button>
      <button id="zoomInBtn">Zoom In</button>
      <input id="zoomLevel" type="number" value="150" min="50" max="300">
      <button id="zoomOutBtn">Zoom Out</button>
    </div>
    <div id="readerLayout">
      <div id="pageContainer">
        <button id="addCommentBtn">+</button>
        <div id="highlightLayer"></div>
        <canvas id="pdfCanvas"></canvas>
        <div id="textLayer" class="textLayer"></div>
      </div>
      <div id="commentRail"></div>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
